name: Feature request
description: Suggest a focused improvement to arxiv2zh
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include credentials, cookies, signed URLs, or private papers.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request relates to arXiv-to-Chinese-PDF workflows in Zotero.
          required: true
